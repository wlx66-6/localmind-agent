# Alembic configuration for LocalMind.
#
# The app runs `upgrade head` itself at startup (see app/db.py), so this file
# matters mainly for two things: telling Alembic where the migration scripts
# live, and letting you run the CLI by hand:
#
#   .venv/Scripts/python.exe -m alembic -c backend/alembic.ini current
#   .venv/Scripts/python.exe -m alembic -c backend/alembic.ini upgrade head
#
# `%(here)s` keeps every path relative to this file, so the CLI works from any
# working directory.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
# Left empty on purpose: env.py derives it from Settings (or LOCALMIND_DB_URL)
# so there is exactly one source of truth for where the database lives.
sqlalchemy.url =
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S